[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Deep Research Agent (LangGraph + FastAPI + Reflection Loop)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "httpx==0.27.2",
  "python-dotenv==1.0.1",
  "langgraph==0.2.58",
  "langchain-core==0.3.29",
  "openai==1.59.5",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "respx==0.21.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
